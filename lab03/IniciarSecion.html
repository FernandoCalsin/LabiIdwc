<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Portal Académico</title>
    
    <!-- CDN de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <!-- Tarjeta de Login -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Encabezado -->
                        <div class="text-center mb-4">
                            <h1 class="h3 fw-bold text-primary">Portal Académico</h1>
                            <p class="text-muted small">Ingresa tus credenciales para acceder</p>
                        </div>

                        <!-- Formulario -->
                        <form action="#" method="POST">
                            
                            <!-- Correo Electrónico -->
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="usuario@ejemplo.com" required>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                            </div>

                            <!-- Opciones: Recordarme / Olvidé contraseña -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="remember">
                                    <label class="form-check-label small" for="remember">Recordarme</label>
                                </div>
                                <a href="#" class="small text-decoration-none">¿Olvidaste tu contraseña?</a>
                            </div>

                            <!-- Botón de Envío -->
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Ingresar</button>
                        </form>

                        <!-- Enlace a Registro y Regreso -->
                        <hr class="my-4">
                        <div class="text-center">
                            <p class="small text-muted mb-2">¿No tienes una cuenta? <a href="Registrarse.html" class="fw-bold text-decoration-none">Regístrate</a></p>
                            <a href="index.html" class="small text-secondary text-decoration-none">&larr; Volver al inicio</a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Script JS de Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
