<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Portal Académico</title>
    
    <!-- CDN de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                
                <!-- Tarjeta de Registro -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Encabezado -->
                        <div class="text-center mb-4">
                            <h1 class="h3 fw-bold text-primary">Crear Cuenta</h1>
                            <p class="text-muted small">Únete al Portal Académico completando tus datos</p>
                        </div>

                        <!-- Formulario -->
                        <form action="#" method="POST">
                            
                            <!-- Nombre Completo -->
                            <div class="row g-2 mb-3">
                                <div class="col-md-6">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" placeholder="Luis" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="apellido" class="form-label">Apellido</label>
                                    <input type="text" class="form-control" id="apellido" placeholder="Pérez" required>
                                </div>
                            </div>

                            <!-- Correo Electrónico -->
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="usuario@ejemplo.com" required>
                            </div>

                            <!-- Contraseñas -->
                            <div class="row g-2 mb-3">
                                <div class="col-md-6">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                                </div>
                            </div>

                            <!-- Términos y Condiciones -->
                            <div class="form-check mb-4">
                                <input type="checkbox" class="form-check-input" id="terms" required>
                                <label class="form-check-label small" for="terms">
                                    Acepto los <a href="#" class="text-decoration-none">términos y condiciones</a> de la plataforma.
                                </label>
                            </div>

                            <!-- Botón de Envío -->
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Registrarse</button>
                        </form>

                        <!-- Enlace a Login y Regreso -->
                        <hr class="my-4">
                        <div class="text-center">
                            <p class="small text-muted mb-2">¿Ya tienes una cuenta? <a href="login.html" class="fw-bold text-decoration-none">Inicia Sesión</a></p>
                            <a href="index.html" class="small text-secondary text-decoration-none">&larr; Volver al inicio</a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Script JS de Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
