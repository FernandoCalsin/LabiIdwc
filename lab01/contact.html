<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/styles.css">
        <title>Forma de contactarme</title>
    </head>
    <body>
        <header>
            <h1>Contácteme</h1>
            <nav>
                <ul class="lista-color">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="author.html">Autores</a></li>
                    <li><a href="system.html">¿Por qué la carrera?</a></li>
                    <li><a href="w3c.html">Estándar W3C</a></li>
                    <li><a href="contact.html">Contacto</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section>
                <h2>Formulario de Contacto</h2>
                <form action="#" method="post">
                    <p>
                        <label for="nombre">Nombre completo:</label><br>
                        <input type="text" id="nombre" name="nombre" required>
                    </p>
                    <p>
                        <label for="correo">Correo electrónico:</label><br>
                        <input type="email" id="correo" name="correo" required>
                    </p>
                    <p>
                        <label for="mensaje">Mensaje o sugerencia:</label><br>
                        <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
                    </p>
                    <p>
                        <button type="submit">Enviar mensaje</button>
                    </p>
                </form>
            </section>
        </main>
        <footer>
            <p>© 2026 Grupo Colaborativo - Todos los derechos reservados</p>
        </footer>
    </body>
</html>
